name: daily-report

# Publishes the day's paper-trading summary as a GitHub issue. GitHub emails
# the repo owner when an issue is opened, so the report lands in your inbox
# using the token this workflow already has — no SMTP credentials to maintain.
#
# Email delivery is still attempted afterwards when SMTP secrets are present,
# but it cannot fail the job: a stale app password should never cost you the
# report.
on:
  schedule:
    # 01:00 UTC = 18:00 US Pacific during PDT, 17:00 during PST. Actions cron is
    # always UTC and does not follow daylight saving, so the local hour shifts
    # by one in winter. The report covers a rolling 24 hours, not a UTC calendar
    # day, so an evening-Pacific send still summarises a full day of trading.
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Read-only: this job reports on the ledger, it never writes one back.
      # If the cache is empty the report is simply empty, which is correct.
      - name: Restore ledger
        uses: actions/cache/restore@v4
        with:
          path: data
          key: ledger-report-${{ github.run_id }}
          restore-keys: ledger-

      - name: Print track record to the run log
        run: npm run track-record

      # Logged as well as emailed: when a run looks wrong, the calibration
      # numbers are the first thing worth reading and should not require
      # downloading the ledger artifact to see.
      - name: Print calibration to the run log
        run: npm run calibration

      - name: Build the report
        run: npm run report:md -- report.md

      # Assigning the issue is what actually triggers the email. Watching a repo
      # defaults to "Participating and @mentions", which a bot-opened issue does
      # not match, so without an assignee the report is created silently.
      - name: Publish as an issue
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh issue create \
            --title "polygon.market — $(date -u +%Y-%m-%d)" \
            --body-file report.md \
            --assignee "$OWNER" \
            --label "daily-report" \
            || gh issue create \
                 --title "polygon.market — $(date -u +%Y-%m-%d)" \
                 --body-file report.md \
                 --assignee "$OWNER"

      # Email on top of the issue. Resend is used when its key is present,
      # Gmail otherwise. Never fails the job — the issue above has already
      # delivered the report, so a mail outage must not lose it.
      - name: Also send by email
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: npm run report
