name: daily-report

# Emails the day's paper-trading summary. Split from paper-trade so the trading
# cycle never depends on mail working, and so changing the delivery time does
# not touch the trading schedule.
on:
  schedule:
    - cron: '30 1 * * *'   # 01:30 UTC daily — adjust to your timezone
  workflow_dispatch:

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Read-only: this job reports on the ledger, it never writes one back.
      # If the cache is empty the report is simply empty, which is correct.
      - name: Restore ledger
        uses: actions/cache/restore@v4
        with:
          path: data
          key: ledger-report-${{ github.run_id }}
          restore-keys: ledger-

      - name: Print track record to the run log
        run: npm run track-record

      - name: Send email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: npm run report
