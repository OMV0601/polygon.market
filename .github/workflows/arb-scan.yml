name: arb-scan

# On-demand only. Read-only: finds negRisk outcome sets whose asks sum below $1
# and reports them. Places no orders and writes nothing to the ledger, so it is
# safe to run at any time and does not touch the paper record.
on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Scan for arbitrage
        env:
          WALLET_BALANCE_USDC: '500'
        run: npm run arb-scan
